# Never built, because a DOS machine cannot run them:
#   hpl1        needs OpenGL with shaders, and threads
#   twp         (Thimbleweed Park) needs OpenGL with shaders
#   watchmaker  needs classic OpenGL (and is unfinished upstream)
#   macs2       needs the Dear ImGui debugger, which has no DOS display backend
DOS_ENGINES_EXCLUDED="hpl1 twp watchmaker macs2"
